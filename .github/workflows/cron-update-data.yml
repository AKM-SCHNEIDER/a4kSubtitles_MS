name: Data Update
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/cron-update-data.yml'
  schedule:
    - cron:  '0 7 * * *'
  workflow_dispatch: ~

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: install
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install requests --user

    - name: update
      run: |
        python3 ./scripts/update_addic7ed.py

    - name: push
      run: |
        git config --global user.email "47229722+newt-sc@users.noreply.github.com"
        git config --global user.name "newt-sc"
        git add a4kSubtitles/data/addic7ed/tvshows.json
        if git diff --cached --quiet; then
          echo "No Addic7ed data changes."
          exit 0
        fi
        git commit -m "chore: update Addic7ed data"
        git push
